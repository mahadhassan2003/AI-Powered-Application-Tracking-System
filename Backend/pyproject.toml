[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Advanced ATS with background resume parsing and semantic matching"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=4.3.0",
    "email-validator>=2.3.0",
    "fastapi>=0.116.2",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.1.1",
    "python-jose[cryptography]>=3.5.0",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.43",
    "uvicorn[standard]>=0.35.0",
    # Background job processing
    "celery>=5.3.0",
    "redis>=5.0.0",
    # AI/ML for resume parsing (lightweight versions)
    "groq>=0.9.0",
    "PyPDF2>=3.0.0",
    "python-docx>=1.1.0",
    # Basic text processing only
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pydantic>=2.11.9",
    # Email templating
    "jinja2>=3.1.0",
]
